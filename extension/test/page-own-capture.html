<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App with its own observer</title>
    <link rel="stylesheet" href="page.css" />
    <!-- This page follows the Shadow observer contract itself, like our ERP does. -->
    <script src="http://localhost:8001/capture.js"></script>
  </head>
  <body>
    <main class="sheet">
      <p class="eyebrow">Accounts payable</p>
      <h1>Invoice queue</h1>
      <p class="lede">This app already loads the observer and the companion itself. Tacet must not add a second one.</p>
      <form id="invoice" onsubmit="return false">
        <div class="row">
          <label for="vendor">Vendor</label>
          <input id="vendor" name="vendor" type="text" value="Nordwerk GmbH" />
        </div>
        <div class="row">
          <label for="net">Net amount</label>
          <input id="net" name="net" type="number" step="0.01" value="0" />
        </div>
        <div class="actions">
          <button id="post" name="post" type="button">Post</button>
        </div>
      </form>
    </main>
  </body>
</html>
